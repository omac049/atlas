<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Same thesis as the header mark, thickened for 16px: two venue legs rise
       toward one event and stop short of meeting. The unclosed apex is the gap. -->
  <defs>
    <clipPath id="d"><circle cx="32" cy="32" r="30"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0b0e12"/>
  <g clip-path="url(#d)">
    <ellipse cx="32" cy="32" rx="13" ry="30" fill="none" stroke="#6fe3a1" stroke-width="1.5" opacity="0.22"/>
    <line x1="2" y1="32" x2="62" y2="32" stroke="#6fe3a1" stroke-width="1.5" opacity="0.22"/>
  </g>
  <path d="M16 50 L28.8 17" fill="none" stroke="#6fe3a1" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M48 50 L35.2 17" fill="none" stroke="#96b8ff" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M23 39 L29 39" fill="none" stroke="#6fe3a1" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M35 39 L41 39" fill="none" stroke="#96b8ff" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="32" y1="11" x2="32" y2="19" stroke="#eef3f8" stroke-width="3.5" stroke-linecap="round"/>
</svg>
