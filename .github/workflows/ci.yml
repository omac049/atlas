name: CI

# The repo's quality gate was entirely manual: 588 tests and a clean ruff run
# were enforced only by a human remembering to run them before committing.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Tests
        # The suite is hermetic (tests/conftest.py refuses live catalog fetches)
        # and runs in ~6s, so no marker selection or parallelism is needed.
        run: pytest -q

      - name: Static checks
        run: |
          python -m compileall -q atlas apps tests
          node --check apps/dashboard/dashboard.js
          node --check apps/dashboard/dashboard-panes.js

      - name: Paper-only invariant
        # Cheap, explicit, and independent of any single test name: the health
        # response and the agent policy must both refuse live execution.
        run: |
          python - <<'PY'
          from apps.api.main import app
          from fastapi.testclient import TestClient
          body = TestClient(app).get("/health").json()
          assert body["trading_enabled"] is False, body
          from atlas.agent import AtlasAgent, AgentPolicy
          try:
              AgentPolicy(execution_mode="live").validate()
          except ValueError:
              pass
          else:
              raise SystemExit("AgentPolicy accepted execution_mode='live'")
          print("paper-only invariant holds")
          PY
